<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Personal resume website of Xianyi Wang, also known as 王贤义.">
    <title>Xianyi Wang</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar" aria-label="Site controls">
        <a class="brand" href="#" aria-label="Xianyi Wang home">
          <span class="brand-mark" data-profile-initials aria-hidden="true">XW</span>
          <span class="brand-text" data-profile-name>Xianyi Wang</span>
        </a>
        <nav class="controls" aria-label="Quick actions">
          <button class="icon-button" type="button" data-action="search" aria-label="Search">
            <span aria-hidden="true">⌕</span>
          </button>
          <button class="icon-button" type="button" data-action="language" aria-label="Switch language">
            <span data-lang-label>中</span>
          </button>
          <button class="icon-button" type="button" data-action="theme" aria-label="Switch theme">
            <span data-theme-icon aria-hidden="true">◐</span>
          </button>
          <button class="icon-button" type="button" data-action="settings" aria-label="Settings">
            <span aria-hidden="true">⚙</span>
          </button>
        </nav>
      </header>

      <main class="page layout">
        <aside class="sidebar" aria-label="Basic profile">
          <section class="hero-copy">
            <p class="eyebrow" data-ui="eyebrow">Resume Website</p>
            <h1 data-profile-name>Xianyi Wang</h1>
            <p class="name-cn" data-profile-cn>王贤义</p>
            <p class="summary" data-ui="summary"></p>
            <div class="hero-actions" data-hero-links aria-label="Profile links"></div>
          </section>

          <section class="status-panel" aria-label="Profile snapshot">
            <div class="signal-stack" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <p class="status-kicker" data-ui="snapshot">Snapshot</p>
            <dl class="snapshot-list" data-snapshot></dl>
          </section>

          <section class="sidebar-sections" data-sidebar-sections aria-label="Basic information"></section>
        </aside>

        <section class="main-content" aria-label="Main resume content">
          <div class="main-section-list" data-main-sections></div>
        </section>
      </main>
    </div>

    <dialog class="panel-dialog" data-dialog="search" aria-labelledby="search-title">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="search-title" data-ui="searchTitle">Search</h2>
          <button class="icon-button" value="close" aria-label="Close search">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <label class="search-field">
          <span data-ui="searchLabel">Search public profile sections</span>
          <input type="search" data-search-input>
        </label>
        <div class="search-results" data-search-results aria-live="polite"></div>
      </form>
    </dialog>

    <dialog class="panel-dialog" data-dialog="settings" aria-labelledby="settings-title">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="settings-title" data-ui="settingsTitle">Settings</h2>
          <button class="icon-button" value="close" aria-label="Close settings">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div class="settings-list">
          <button class="setting-row" type="button" data-action="language">
            <span data-ui="languageSetting">Language</span>
            <strong data-setting-language>English</strong>
          </button>
          <button class="setting-row" type="button" data-action="theme">
            <span data-ui="themeSetting">Theme</span>
            <strong data-setting-theme>Light</strong>
          </button>
        </div>
      </form>
    </dialog>

    <script src="assets/profile-data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
